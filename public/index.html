<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bela">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f0e3">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Bela online</title>
<style>
:root{--paper:#f5f0e3;--panel:#fffdf7;--ink:#1d211c;--soft:#6d6b60;--line:#1d211c1f;--green:#1d4d36;--green2:#2c6a4b;
  --felt:radial-gradient(ellipse at 50% 35%,#2f7350 0%,#1f5239 55%,#163c2a 100%);--gold:#d8b25c;--bad:#b3261e;
  --serif:Georgia,'Times New Roman',serif;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box}
html,body{background:var(--paper);touch-action:manipulation;-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:400 16px/1.4 var(--sans);-webkit-tap-highlight-color:transparent;min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body.ingame{background:#163c2a;color:#f3efe2}
body.ingame main{background:var(--felt);min-height:100vh}
main{max-width:640px;margin:0 auto;padding:12px 12px 28px}
h1{margin:18px 0 0;font:700 44px/1 var(--serif);color:var(--green);text-align:center;letter-spacing:.5px}
.tag{text-align:center;color:var(--soft);margin:6px 0 0;font-size:14px;letter-spacing:2px;text-transform:uppercase}
h2{margin:6px 0 14px;font:700 26px/1.15 var(--serif);color:var(--green)}
input,button{font:inherit;color:inherit}
input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);font-size:17px;-webkit-appearance:none;appearance:none}
input:focus{outline:2px solid var(--green2);border-color:transparent}
label{display:block;margin:14px 0 6px}
.btn{display:block;width:100%;min-height:52px;margin:10px 0;border:1.5px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 16px;font-size:17px;font-weight:600;cursor:pointer;box-shadow:0 1px 2px #0000000d}
.btn.main{background:var(--green);border-color:var(--green);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn:active:not(:disabled){transform:translateY(1px)}
.back{background:none;border:0;padding:8px 0;font-size:16px;color:var(--soft);cursor:pointer}
.muted{color:var(--soft)}.small{font-size:13px}.center{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>.btn{flex:1;width:auto;margin:6px 0}
.box{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.mode{text-align:left}.mode b{display:block;font:700 20px var(--serif);color:var(--green);margin-bottom:2px}.mode span{font-weight:400}
.list .item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.win{color:var(--green2);font-weight:700}.loss{color:var(--bad);font-weight:700}
.err{color:var(--bad);min-height:1.4em;text-align:center;font-size:14px}
body.ingame .err{color:#ffb4a9}
/* suit symbols, cut from the jacks of the scanned deck */
.pip{width:1.3em;height:1.3em;vertical-align:-.3em;object-fit:contain}
/* game: header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.top .back{color:#f3efe2b3;font-size:15px;min-width:64px;text-align:left}
.scores{display:flex;align-items:center;gap:10px;background:#00000038;border:1px solid #ffffff1f;border-radius:14px;padding:4px 14px}
.scores div{text-align:center;line-height:1.05}.scores small{display:block;font-size:10px;letter-spacing:1.5px;color:#f3efe299}
.scores b{font:700 22px var(--sans);font-variant-numeric:tabular-nums;display:block;min-width:2.2em}.scores .sep{color:#f3efe266}
.meta{min-width:64px;text-align:right;font-size:11px;line-height:1.3;color:#f3efe299}
/* points in this hand vs what the calling team needs to pass */
.pass{margin:0 2px 8px;font-size:12px;color:#f3efe2b3;min-height:30px}
.pass .pl{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pass b{color:#fff;font-size:14px;font-variant-numeric:tabular-nums}
.pbar{height:6px;border-radius:3px;background:#ffffff1f;margin-top:4px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--gold);border-radius:3px;transition:width .4s}
.pass.ok .pbar i{background:#6fcf97}.pass.fell .pbar i{background:#ef7a6e}
.pass .tagok{color:#6fcf97;font-weight:700}.pass .tagfell{color:#ef7a6e;font-weight:700}
/* table */
.table{position:relative;height:322px}
.seat{position:absolute;display:flex;flex-direction:column;align-items:center;width:92px;text-align:center;line-height:1.15}
.seat.top{top:0;left:50%;margin-left:-46px}.seat.left{left:0;top:124px}.seat.right{right:0;top:124px}.seat.bot{bottom:0;left:50%;margin-left:-46px}
.av{position:relative;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#f3efe2;color:var(--green);font:700 16px var(--serif);border:2px solid #ffffff55}
.seat.turn .av{border-color:var(--gold);box-shadow:0 0 0 3px #d8b25c55}
.dealer{position:absolute;right:-6px;bottom:-4px;width:17px;height:17px;border-radius:50%;background:var(--gold);color:#1d211c;font:700 10px/17px var(--sans);font-style:normal}
.nm{font-size:13px;font-weight:600;margin-top:3px;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat small{font-size:11px;color:#f3efe2a6}
.off{opacity:.5}
.tbar{display:block;width:64px;height:4px;border-radius:2px;background:#ffffff26;margin-top:4px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--gold);animation:drain linear forwards}
.status .tbar{width:100%;margin:6px 0 0}
@keyframes drain{from{width:var(--from)}to{width:0}}
.mid{position:absolute;left:50%;top:160px;width:0;height:0}
.mid .card{position:absolute;width:56px;margin:-45px 0 0 -28px;box-shadow:0 3px 8px #0006}
.mid .t{transform:translateY(-52px)}.mid .b{transform:translateY(52px)}.mid .l{transform:translate(-68px,0)}.mid .r{transform:translate(68px,0)}
.trump{position:absolute;top:2px;left:0;display:flex;align-items:center;gap:6px;background:#00000038;border:1px solid #ffffff1f;border-radius:12px;padding:5px 9px 5px 6px;font-size:11px;line-height:1.15;color:#f3efe2b3}
.trump img{width:26px;height:26px;object-fit:contain}.trump b{display:block;color:#f3efe2;font-size:13px}
/* cards: Mađarice images (from "karte za belu.pdf"), 212x338 */
.card{display:inline-block;vertical-align:middle;width:64px;aspect-ratio:212/338;border-radius:6px;background:#fff;box-shadow:0 1px 3px #0006;object-fit:cover}
.card.back{background:linear-gradient(135deg,#1d4d36 25%,#24603f 25% 50%,#1d4d36 50% 75%,#24603f 75%) 0 0/14px 14px;border:4px solid #fffdf7;box-shadow:inset 0 0 0 1.5px var(--gold),0 1px 3px #0006}
/* hand: two rows of 4 on phones, one row of 8 on wide screens */
.status{min-height:24px;margin:8px 0 6px;text-align:center;font-size:14px;color:#f3efe2cc}
.status b{color:#fff}
.hand{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.hand button{flex:0 0 calc((100% - 24px) / 4);max-width:104px;padding:0;border:0;background:none;cursor:pointer;-webkit-touch-callout:none}
@media (min-width:700px){.hand button{flex-basis:calc((100% - 56px) / 8)}}
.hand .card{width:100%;display:block;border-radius:8px;transition:transform .15s,filter .15s}
.hand button:disabled{cursor:default}
.myturn .hand button:disabled .card{filter:brightness(.55) saturate(.7)}
.myturn .hand button:not(:disabled) .card{transform:translateY(-6px);box-shadow:0 0 0 3px var(--gold),0 6px 12px #0007}
/* calling trump */
.bid{position:absolute;inset:58px 4px 62px;z-index:2;background:#fffdf7f2;color:var(--ink);border-radius:16px;padding:10px 12px;box-shadow:0 10px 30px #0008;display:flex;flex-direction:column;justify-content:center}
.bid .ptitle{text-align:center;font:700 15px var(--serif);color:var(--green);margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:8px}
.bid .ptitle .card{width:24px;border-radius:3px}
.suits{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.suits button{aspect-ratio:1/1.1;border:1.5px solid var(--line);border-radius:10px;background:#fff;box-shadow:0 2px 4px #0002;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;padding:4px}
.suits button img{width:72%;aspect-ratio:1;object-fit:contain}
.suits button:disabled{opacity:.25;cursor:default}
.suits button:active:not(:disabled){transform:scale(.96)}
.bid .btn{min-height:44px;margin:10px 0 0}
.must{text-align:center;color:var(--soft);font-size:13px;margin-top:10px}
/* panels on the felt */
.panel{background:#00000030;border:1px solid #ffffff1a;border-radius:14px;padding:10px 12px;margin:10px 0;font-size:14px}
.panel .card{width:34px;border-radius:3px;margin:1px}
.zvb{position:absolute;top:2px;right:0;display:flex;align-items:center;gap:8px;background:#00000038;border:1px solid #ffffff1f;border-radius:12px;padding:5px 10px;font-size:11px;line-height:1.15;color:#f3efe2b3;text-align:left;cursor:pointer;z-index:3}
.zvb b{display:block;color:#f3efe2;font-size:13px}
.zvlist{position:absolute;top:48px;right:0;z-index:3;width:min(330px,100%);background:var(--panel);color:var(--ink);border-radius:14px;padding:6px 12px;box-shadow:0 10px 30px #0008}
.zvlist .zrow{border-color:var(--line)}.zvlist .card{width:34px;border-radius:3px;margin:1px}
.zrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid #ffffff14}
.zrow:first-of-type{border-top:0}
.zrow .who{width:76px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.zrow .zc{flex:1}.zrow b{font:700 16px var(--sans);font-variant-numeric:tabular-nums;min-width:2.4em;text-align:center}
.result{background:var(--panel);color:var(--ink);border:0}
.result .ptitle{font:700 20px var(--serif);color:var(--green);margin-bottom:6px;display:flex;align-items:center;justify-content:center;gap:8px}
.result table{width:100%;border-collapse:collapse;font-size:15px}
.result td,.result th{padding:6px 4px;text-align:center;width:28%;font-variant-numeric:tabular-nums}.result td:first-child,.result th:first-child{text-align:left;color:var(--soft);width:auto}
.result tr+tr td{border-top:1px solid var(--line)}.result .tot td{font:700 18px var(--sans);color:var(--ink)}.result .tot td:first-child{color:var(--ink)}
.badge{background:var(--bad);color:#fff;border-radius:6px;padding:3px 8px;font:700 11px/1 var(--sans);letter-spacing:.5px;text-transform:uppercase}
.big{text-align:center;font:700 30px var(--serif);margin:8px 0}
.hands{font-size:12px;color:var(--soft);text-align:center;margin-top:6px}
/* pop-up (zvanja, bela) */
#pop{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#0008;opacity:0;pointer-events:none;transition:opacity .25s;padding:20px}
#pop.on{opacity:1;pointer-events:auto}
.popcard{background:var(--panel);color:var(--ink);border-radius:18px;padding:18px 18px 12px;width:min(420px,100%);box-shadow:0 20px 50px #000a;transform:scale(.94);transition:transform .25s}
#pop.on .popcard{transform:none}
.popcard h3{margin:0 0 10px;text-align:center;font:700 24px var(--serif);color:var(--green)}
.popcard .zrow{border-color:var(--line)}.popcard .card{width:44px;border-radius:4px;margin:1px}
.popcard small{display:block;text-align:center;color:var(--soft);margin-top:10px}
/* fan + loader (from Bela Blok) */
.fan{position:relative;width:104px;height:50px;flex:0 0 auto}
.fan i{position:absolute;left:50%;top:2px;display:grid;place-items:center;width:26px;height:38px;margin-left:-13px;background:#fff;border:1.5px solid #1d211c;border-radius:5px;box-shadow:1px 2px 0 rgba(0,0,0,.18);transform:rotate(var(--r));transform-origin:50% 226%;transition:transform .25s}
.fan i img{width:70%;aspect-ratio:1;object-fit:contain}
.fan i:nth-child(1){--r:-27deg}.fan i:nth-child(2){--r:-9deg}.fan i:nth-child(3){--r:9deg}.fan i:nth-child(4){--r:27deg}
.fan.big{width:208px;height:100px;margin:30px auto 26px}
.fan.big i{top:4px;width:52px;height:76px;margin-left:-26px;border-radius:9px;border-width:2px}
#loader{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--paper);transition:opacity .3s}
#loader.out{opacity:0;pointer-events:none}
.deal i{animation:deal 3.2s infinite}
.deal i:nth-child(2){animation-delay:-2.4s}.deal i:nth-child(3){animation-delay:-1.6s}.deal i:nth-child(4){animation-delay:-.8s}
@keyframes deal{
  0%{transform:rotate(-27deg) translateY(-126%) perspective(300px) rotateX(0deg) translateY(126%);opacity:1;z-index:1;animation-timing-function:ease-in}
  10%{transform:rotate(-27deg) translateY(-126%) perspective(300px) rotateX(82deg) translateY(126%);opacity:1;z-index:1}
  14%{transform:rotate(-27deg) translateY(-126%) perspective(300px) rotateX(82deg) translateY(126%);opacity:0;z-index:1}
  14.1%{transform:rotate(27deg) translateY(calc(-126% - 60px)) perspective(300px) rotateX(0deg) translateY(126%);opacity:0;z-index:4}
  22%,35%{transform:rotate(27deg) translateY(-126%) perspective(300px) rotateX(0deg) translateY(126%);opacity:1;z-index:4}
  45%,60%{transform:rotate(9deg) translateY(-126%) perspective(300px) rotateX(0deg) translateY(126%);opacity:1;z-index:3}
  70%,85%{transform:rotate(-9deg) translateY(-126%) perspective(300px) rotateX(0deg) translateY(126%);opacity:1;z-index:2}
  95%,100%{transform:rotate(-27deg) translateY(-126%) perspective(300px) rotateX(0deg) translateY(126%);opacity:1;z-index:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.deal i{animation:none!important}} /* the turn timer keeps running */
</style>
</head>
<body>
<div id="loader" aria-hidden="true"><div class="fan big deal"></div></div>
<main id="app"></main>
<div id="pop" role="dialog" aria-live="polite" onclick="this.classList.remove('on')"></div>
<script src="game.js"></script>
<script>
const SUITNAME = { H: 'Herc', K: 'Karo', P: 'Pik', T: 'Tref' };
const RANKNAME = { 7: 'VII', 8: 'VIII', 9: 'IX', X: 'X', J: 'Dečko', Q: 'Dama', K: 'Kralj', A: 'As' };
const pip = s => `<img class="pip" src="suits/${s}.png" alt="${SUITNAME[s]}">`;
const fanInner = () => 'HKPT'.split('').map(s => `<i><img src="suits/${s}.png" alt=""></i>`).join('');
const fan = (cls = '') => `<div class="fan ${cls}" aria-hidden="true">${fanInner()}</div>`;
document.querySelector('#loader .fan').innerHTML = fanInner();

const MODES = { zatvorena: ['Zatvorena', 'Vidiš 6 karata, zoveš adut, pa dobiješ zadnje 2. Ako svi kažu dalje, djelitelj mora zvati.'],
  otvorena: ['Otvorena', 'Djeliteljeva 8. karta leži otvorena na stolu. 1. krug: može se zvati samo njezina boja. 2. krug: jedna od ostale 3 boje, djelitelj mora zvati.'] };
const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const cardHtml = (c, cls = '') => `<img class="card ${cls}" src="cards/${c}.webp" alt="${RANKNAME[c[1]]} ${SUITNAME[c[0]]}" draggable="false">`;
const $ = document.getElementById('app');
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
let me = load('bela', {}), games = load('bela-history', []);
let state = null, es = null, err = '', screen = 'home', mode = 'zatvorena', offline = false, local = null, zvOpen = false;
const shown = new Set(); // pop-ups already shown
const invite = new URLSearchParams(location.search).get('room');
if (invite) { me.room = invite.toUpperCase().slice(0, 8); screen = 'join'; history.replaceState(null, '', location.pathname); }

async function api(body) {
  if (local) return localAct(body);
  err = '';
  let out, r;
  try { r = await fetch('/api', { method: 'POST', body: JSON.stringify({ room: me.room, token: me.token, ...body }) }); out = await r.json(); }
  catch { out = { error: 'Nema veze sa serverom' }; }
  if (!r?.ok) { err = out.error; render(); throw new Error(out.error); }
  return out;
}

async function join(room, name, m = mode) {
  me = { ...me, room: room.trim().toUpperCase(), name: name.trim() };
  if (me.room !== load('bela', {}).room) delete me.token; // a token only belongs to its own room
  const out = await api({ type: 'join', room: me.room, name: me.name, mode: m });
  me.token = out.token; me.room = out.room;
  localStorage.setItem('bela', JSON.stringify(me));
  listen();
}

function listen() {
  es?.close();
  es = new EventSource(`/events?room=${encodeURIComponent(me.room)}&token=${encodeURIComponent(me.token)}`);
  es.onmessage = e => { state = JSON.parse(e.data); state.recv = Date.now(); saveResult(); render(); };
  es.onerror = () => { if (es.readyState === 2) { state = null; screen = 'home'; err = 'Veza prekinuta – nastavi igru ponovno'; render(); } };
}
function toMenu() { es?.close(); es = null; clearTimeout(local?.timer); local = null; state = null; go('home'); }

// Offline vs bots: the same engine (game.js) runs on the phone; I'm seat 0, partner bot seat 2.
function startOffline(m) {
  const names = ['Ana', 'Bruno', 'Cvita'].map(n => ({ name: n, bot: true, online: true }));
  local = { g: Bela.newGame(m), seats: [{ name: me.name || 'Ja', online: true }, ...names], timer: null };
  Bela.deal(local.g); publish();
}
function localAct(body) {
  err = '';
  const g = local.g;
  try {
    if (body.type !== 'next') Bela.act(g, 0, body);
    else if (g.phase === 'over') Bela.deal(local.g = Object.assign(Bela.newGame(g.mode), { dealer: g.dealer }));
    else if (g.phase === 'done') Bela.deal(g);
  } catch (e) { err = e.message; render(); throw e; }
  publish();
  return {};
}
function publish() {
  clearTimeout(local.timer);
  const g = local.g, t = Bela.nextTimer(g, s => s !== 0); // my own turn is timed too
  state = { seats: local.seats, you: 0, now: Date.now(), recv: Date.now(), game: Bela.view(g, 0) };
  saveResult(); render();
  if (t) local.timer = setTimeout(() => { t.run(); publish(); }, t.ms);
}

// Finished game -> this device's history (and friends list, which is built from it).
function saveResult() {
  const { seats, you, game: g } = state;
  if (g.phase !== 'over' || games.some(h => h.id === g.id)) return;
  const mine = you % 2, names = t => [t, t + 2].map(s => seats[s]?.name || '?');
  games.unshift({ id: g.id, date: Date.now(), mode: g.mode, room: local ? null : me.room, me: seats[you]?.name, us: names(mine), them: names(1 - mine),
    score: [g.scores[mine], g.scores[1 - mine]], win: g.winner === mine, belot: g.belot != null });
  localStorage.setItem('bela-history', JSON.stringify(games.slice(0, 200)));
}

const go = s => { screen = s; err = ''; render(); };
function render() {
  document.body.classList.toggle('ingame', !!state && state.game.phase !== 'lobby');
  if (state) return renderGame();
  draw({ home, play, join: joinScreen, friends, hist }[screen]());
}
function draw(h) { $.innerHTML = h + `<div class="err" role="alert">${esc(err)}</div>`; }
const back = `<button class="back" onclick="go('home')">← Izbornik</button>`;

function home() {
  return `<h1>Bela</h1><p class="tag">Hrvatska kartaška igra</p>${fan('big')}
    ${me.token ? `<button class="btn main" onclick="join(me.room, me.name).catch(() => {})">Nastavi igru · soba ${esc(me.room)}</button>` : ''}
    <button class="btn ${me.token ? '' : 'main'}" onclick="offline=false;go('play')">Igraj online</button>
    <button class="btn" onclick="offline=true;go('play')">Igraj protiv botova</button>
    <div class="row"><button class="btn" onclick="go('friends')">Prijatelji</button><button class="btn" onclick="go('hist')">Povijest igara</button></div>`;
}

function play() {
  return `${back}<h2>${offline ? 'Protiv botova' : 'Način igre'}</h2>` + Object.entries(MODES).map(([k, [t, d]]) =>
    `<button class="btn mode" onclick="${offline ? `startOffline('${k}')` : `mode='${k}';go('join')`}"><b>${t}</b><span class="small muted">${d}</span></button>`).join('');
}

function joinScreen() {
  return `${back}<h2>${invite ? 'Poziv u sobu' : MODES[mode][0]}</h2>
    <label class="small muted" for="roomIn">Kod sobe — svi upisuju isti</label>
    <div class="row"><input id="roomIn" value="${esc(me.room || '')}" maxlength="8" autocapitalize="characters" autocomplete="off" style="flex:1">
      <button class="back" onclick="roomIn.value=Math.random().toString(36).slice(2,6).toUpperCase()">Nova soba</button></div>
    <label class="small muted" for="nameIn">Tvoje ime</label>
    <input id="nameIn" value="${esc(me.name || '')}" maxlength="20" autocomplete="nickname">
    <button class="btn main" style="margin-top:20px" onclick="join(roomIn.value, nameIn.value).catch(() => {})">Uđi u sobu</button>
    <p class="small muted">Ako soba već postoji, igra se njezin način igre.</p>`;
}

function friends() {
  const by = {};
  for (const g of games.filter(g => g.room)) for (const [list, w] of [[g.us, 'with'], [g.them, 'vs']]) for (const n of list) {
    if (n === g.me) continue;
    const f = by[n] ??= { name: n, with: 0, withWins: 0, vs: 0, vsWins: 0 };
    f[w]++; if (g.win) f[w + 'Wins']++;
  }
  const rows = Object.values(by).sort((a, b) => b.with + b.vs - a.with - a.vs);
  return `${back}<h2>Prijatelji</h2>
    <p class="small muted">Svi s kojima si igrao na ovom uređaju. Za igru s njima: Igraj online → upiši kod sobe → „Pozovi prijatelje”.</p>
    ${rows.length ? `<div class="list">${rows.map(f => `<div class="item"><b>${esc(f.name)}</b><span class="small muted">
      zajedno ${f.withWins}/${f.with} · protiv ${f.vsWins}/${f.vs}</span></div>`).join('')}</div>` : fan('big deal') + '<p class="center muted">Još nema prijatelja — odigraj prvu igru.</p>'}`;
}

function hist() {
  const wins = games.filter(g => g.win).length;
  return `${back}<h2>Povijest igara</h2>
    ${games.length ? `<p class="muted">${games.length} igara · ${wins} pobjeda</p><div class="list">${games.map(g => `<div class="item">
      <span><span class="${g.win ? 'win' : 'loss'}">${g.win ? 'Pobjeda' : 'Poraz'}</span>${g.belot ? ' · belot' : ''} <span class="small muted">${MODES[g.mode]?.[0] || ''}${g.room ? '' : ' · protiv botova'} · ${new Date(g.date).toLocaleDateString('hr-HR')}</span><br>
      <span class="small">${esc(g.us.join(' & '))} vs ${esc(g.them.join(' & '))}</span></span><b style="font-size:17px;font-variant-numeric:tabular-nums">${g.score[0]}:${g.score[1]}</b></div>`).join('')}</div>`
      : fan('big deal') + '<p class="center muted">Još nema odigranih igara.</p>'}`;
}

async function share() {
  const url = `${location.origin}/?room=${encodeURIComponent(me.room)}`;
  try { if (navigator.share) await navigator.share({ title: 'Bela', text: `Igraj belu sa mnom, soba ${me.room}`, url }); else { await navigator.clipboard.writeText(url); err = 'Poveznica kopirana'; render(); } }
  catch { /* user closed the share sheet */ }
}

function pop(html, ms) {
  const p = document.getElementById('pop');
  p.innerHTML = `<div class="popcard">${html}<small>Dodirni za zatvaranje</small></div>`;
  p.classList.add('on'); clearTimeout(pop.t); pop.t = setTimeout(() => p.classList.remove('on'), ms);
}

function renderGame() {
  const { seats, you, game: g } = state, mine = you % 2;
  const name = s => seats[s] ? esc(seats[s].name) : '—';
  const MV = t => t === mine ? 'MI' : 'VI';
  const call = (type, extra = '') => `api({type:'${type}'${extra}}).catch(() => {})`;
  // Countdown for whoever is on turn; the server's clock is converted to ours.
  const timer = () => {
    if (!g.deadline) return '';
    const left = g.deadline - state.now - (Date.now() - state.recv);
    return `<span class="tbar"><i style="--from:${Math.min(100, Math.max(0, left / Bela.TURN_MS * 100))}%;animation-duration:${Math.max(0, left)}ms"></i></span>`;
  };

  if (g.phase === 'lobby') {
    let h = `${back.replace("go('home')", 'toMenu()')}<h2>Soba ${esc(me.room)}</h2><p class="small muted">${MODES[g.mode][0]} · partneri sjede nasuprot (mjesta 1 i 3 protiv 2 i 4). Dodirni prazno mjesto da sjedneš.</p>`;
    h += [0, 1, 2, 3].map(s => `<div class="box row"><b>Mjesto ${s + 1}</b><span class="muted small">${s % 2 ? 'tim B' : 'tim A'}</span><span style="flex:1;text-align:right">${seats[s] ? name(s) + (s === you ? ' (ti)' : '') + (seats[s].online ? '' : ' <span class="muted small">(nije spojen)</span>')
      : `<button class="back" style="color:var(--green2);font-weight:600" onclick="${call('sit', `,seat:${s}`)}">Sjedni ovdje</button>`}</span></div>`).join('');
    h += `<button class="btn" onclick="share()">Pozovi prijatelje</button>
      <div class="row"><button class="btn main" onclick="${call('start')}" ${seats.includes(null) ? 'disabled' : ''}>Počni igru</button>
      <button class="btn" onclick="leave()">Izađi iz sobe</button></div>`;
    return draw(h);
  }

  const zvHtml = () => g.zv.list.map((zs, s) => zs.map(z => `<div class="zrow"><span class="who">${name(s)}</span><span class="zc">${z.cards.map(c => cardHtml(c)).join('')}</span><b>${z.pts}</b></div>`).join('')).join('');
  // Pop-ups: zvanja at the start of play, bela when it is called.
  const key = g.id + ':' + g.history.length;
  if (g.phase === 'play' && g.zv?.team != null && !g.last && !shown.has(key + 'zv')) {
    shown.add(key + 'zv'); zvOpen = false; pop(`<h3>Zvanja · ${MV(g.zv.team)} ${g.zv.sum}</h3>${zvHtml()}`, Bela.ZVANJA_MS - 500);
  }
  [0, 1].forEach(t => { if (g.bela?.[t] && !shown.has(key + 'bela' + t)) { shown.add(key + 'bela' + t); pop(`<h3>Bela!</h3><p class="center">${MV(t)} +20</p>`, 2500); } });

  const pos = s => ['bot', 'right', 'top', 'left'][(s - you + 4) % 4], mini = { bot: 'b', right: 'r', top: 't', left: 'l' };
  const seat = s => `<div class="seat ${pos(s)} ${g.turn === s ? 'turn' : ''} ${seats[s]?.online === false ? 'off' : ''}">
    <span class="av">${esc((seats[s]?.name || '?')[0].toUpperCase())}${s === g.dealer ? '<i class="dealer" title="miješa">D</i>' : ''}</span>
    <span class="nm">${s === you ? 'Ti' : name(s)}</span><small>${MV(s % 2)}${seats[s]?.bot ? ' · bot' : ''}</small>${g.turn === s ? timer() : ''}</div>`;
  const played = {};
  (g.trick || []).forEach((c, i) => played[(g.leader + i) % 4] = c);
  const myTurn = g.turn === you;

  let h = `<header class="top"><button class="back" onclick="toMenu()">← Izađi</button>
    <div class="scores" aria-label="Rezultat"><div><small>MI</small><b>${g.scores[mine]}</b></div><span class="sep">:</span><div><small>VI</small><b>${g.scores[1 - mine]}</b></div></div>
    <div class="meta">${MODES[g.mode][0]}<br>${local ? 'protiv botova' : 'soba ' + esc(me.room)}</div></header>`;

  if (g.phase === 'bid' || g.phase === 'play') {
    // Caller passes with more than half of all points (cards + counted zvanja + bela); last-trick 10 still to come.
    const zvT = t => (g.zv?.team === t ? g.zv.sum : 0) + (g.bela?.[t] || 0);
    const c = g.caller, tot = [0, 1].map(t => g.pts[t] + zvT(t)), need = Math.floor((Bela.HAND + zvT(0) + zvT(1)) / 2) + 1;
    const left = Bela.HAND - g.pts[0] - g.pts[1], ok = c != null && tot[c] >= need, fell = c != null && tot[c] + left < need;
    h += g.phase === 'bid' ? `<div class="pass"><div class="pl"><span>Bodovi u ruci</span><span>čeka se adut</span></div><div class="pbar"></div></div>`
      : `<div class="pass ${ok ? 'ok' : fell ? 'fell' : ''}"><div class="pl"><span>Zvali ${MV(c)}: <b>${tot[c]}</b> / ${need} za prolaz ${ok ? '<span class="tagok">· prošli</span>' : fell ? '<span class="tagfell">· pad</span>' : ''}</span>
        <span>${MV(1 - c)} <b>${tot[1 - c]}</b></span></div><div class="pbar"><i style="width:${Math.min(100, tot[c] / need * 100)}%"></i></div></div>`;
  }
  h += `<section class="table ${myTurn ? 'myturn' : ''}">${[0, 1, 2, 3].map(seat).join('')}
    <div class="mid">${Object.entries(played).map(([s, c]) => cardHtml(c, mini[pos(+s)])).join('')}${g.phase === 'bid' && g.up && !myTurn ? cardHtml(g.up) : ''}</div>
    ${g.zv?.team != null && (g.phase === 'play' || g.phase === 'done') ? `<button class="zvb" onclick="zvOpen=!zvOpen;render()" aria-expanded="${zvOpen}"><span>Zvanja<b>${MV(g.zv.team)} ${g.zv.sum}</b></span>${zvOpen ? '▴' : '▾'}</button>
      ${zvOpen ? `<div class="zvlist" onclick="zvOpen=false;render()">${zvHtml()}</div>` : ''}` : ''}
    ${g.trump ? `<div class="trump"><img src="suits/${g.trump}.png" alt=""><span>Adut<b>${SUITNAME[g.trump]}</b>zvali ${MV(g.caller)}</span></div>` : ''}`;
  if (g.phase === 'bid' && myTurn) {
    const mustCall = you === g.dealer && (!g.up || g.round === 2);
    const title = g.up ? (g.round === 1 ? `1. krug · karta na stolu ${cardHtml(g.up)}` : `2. krug · bilo koja osim ${pip(g.up[0])}`) : 'Zovi adut';
    h += `<div class="bid"><div class="ptitle">${title}</div><div class="suits">${'HKPT'.split('').map(s =>
      `<button ${g.bids.includes(s) ? '' : 'disabled'} onclick="${call('bid', `,suit:'${s}'`)}"><img src="suits/${s}.png" alt="">${SUITNAME[s]}</button>`).join('')}</div>
      ${mustCall ? '<div class="must">Djelitelj mora zvati adut</div>' : `<button class="btn" onclick="${call('bid', ',suit:null')}">Dalje</button>`}</div>`;
  }
  h += `</section>`;

  const status = g.phase === 'bid' ? (myTurn ? `<b>Zovi adut</b>` : `Zove <b>${name(g.turn)}</b>${g.up ? ` · ${g.round}. krug` : ''}…`)
    : g.phase === 'play' ? (myTurn ? `<b>Tvoj potez</b> — baci kartu` : g.turn != null ? `Na potezu: <b>${name(g.turn)}</b>` : '&nbsp;') : '';
  h += `<div class="status ${myTurn ? 'myturn' : ''}">${status}${myTurn ? timer() : ''}</div>`;

  if (g.hand && g.phase !== 'done' && g.phase !== 'over') h += `<div class="hand ${myTurn && g.phase === 'play' ? 'myturn' : ''}">${g.hand.map(c => `<button ${g.legal.includes(c) ? '' : 'disabled'} onclick="${call('play', `,card:'${c}'`)}" aria-label="${RANKNAME[c[1]]} ${SUITNAME[c[0]]}">${cardHtml(c)}</button>`).join('')}
    ${g.phase === 'bid' ? '<button disabled aria-label="karta dolazi nakon zvanja"><span class="card back"></span></button>'.repeat(g.up && you === g.dealer ? 1 : 2) : ''}</div>`;

  if (g.bela?.some(Boolean) && g.phase === 'play') h += `<div class="panel">Bela · <b>${MV(g.bela[mine] ? mine : 1 - mine)} +20</b></div>`;
  if (g.last && g.phase === 'play') h += `<div class="panel">Zadnji štih → <b>${name(g.last.winner)}</b><div style="margin-top:6px">${g.last.cards.map(c => cardHtml(c)).join('')}</div></div>`;

  if (g.phase === 'done' || g.phase === 'over') {
    const r = g.result;
    h += `<div class="panel result">`;
    if (r) h += `<div class="ptitle">Rezultat ruke ${r.fell ? '<span class="badge">Pad</span>' : ''}${r.stiglja != null ? '<span class="badge" style="background:var(--green2)">Štiglja</span>' : ''}</div>
      <table><tr><th></th><th>MI</th><th>VI</th></tr>
      <tr><td>Karte</td><td>${r.cards[mine]}</td><td>${r.cards[1 - mine]}</td></tr>
      <tr><td>Zvanja i bela</td><td>${r.zv[mine]}</td><td>${r.zv[1 - mine]}</td></tr>
      <tr class="tot"><td>Ruka</td><td>${r.score[mine]}</td><td>${r.score[1 - mine]}</td></tr></table>`;
    if (g.phase === 'over') h += `<div class="big" style="color:${g.winner === mine ? 'var(--green2)' : 'var(--bad)'}">${g.belot != null ? 'Belot! ' : ''}${g.winner === mine ? 'Pobjeda!' : 'Poraz'}</div>`;
    h += `<button class="btn main" onclick="${call('next')}">${g.phase === 'over' ? 'Nova igra' : 'Sljedeća ruka'}</button>
      ${g.history.length ? `<div class="hands">Ruke: ${g.history.map(s => `${s[mine]}:${s[1 - mine]}`).join(' · ')}</div>` : ''}</div>`;
  }
  draw(h);
}

async function leave() { await api({ type: 'leave' }).catch(() => {}); delete me.token; localStorage.setItem('bela', JSON.stringify(me)); toMenu(); }

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {}); // needs https or localhost
setTimeout(() => { const l = document.getElementById('loader'); l.classList.add('out'); setTimeout(() => l.remove(), 300); }, Math.max(0, 1300 - performance.now()));
</script>
</body>
</html>
